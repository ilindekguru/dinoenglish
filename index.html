          const [gameState, setGameState] = useState('splash'); // Start with 'splash'

          const [selectedCategory, setSelectedCategory] = useState(null);

          const [indexA, setIndexA] = useState(0);

          const [feedbackB, setFeedbackB] = useState(null);
          const [freezeB, setFreezeB] = useState(false);

          // Game Constants

          const WIN_LIMIT_B = 85; 
          const PULL_POWER = 5;

          // Splash Screen Effect (Diperpanjang jadi 6 detik)
          useEffect(() => {
              if (gameState === 'splash') {

                      setGameState('title');
                  }, 6000); // 6 detik
                  return () => clearTimeout(timer);
              }
          }, [gameState]);

          // Effect untuk suara menang (Updated Source)
          useEffect(() => {
              if (gameState === 'wonA' || gameState === 'wonB') {
                  const winAudio = new Audio('https://github.com/ilindekguru/Lagulagu/raw/refs/heads/main/brass-fanfare-with-timpani-and-winchimes-reverberated-146260.mp3');
                  winAudio.volume = 1.0; 
                  winAudio.play().catch(err => console.log("Audio play failed:", err));
              }
          }, [gameState]);

          // Function to toggle fullscreen with Vendor Prefixes
          const toggleFullscreen = () => {
            const elem = document.documentElement;
            const isFS = document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement;

            if (!isFS) {
              if (elem.requestFullscreen) {
                elem.requestFullscreen().then(() => setIsFullscreen(true)).catch(handleFsError);
              } else if (elem.webkitRequestFullscreen) { /* Safari */
                elem.webkitRequestFullscreen();
                setIsFullscreen(true);
              } else if (elem.msRequestFullscreen) { /* IE11 */
                elem.msRequestFullscreen();
                setIsFullscreen(true);
              }
            } else {
              if (document.exitFullscreen) {
                document.exitFullscreen().then(() => setIsFullscreen(false)).catch((err) => console.log(err));
              } else if (document.webkitExitFullscreen) { /* Safari */
                document.webkitExitFullscreen();
                setIsFullscreen(false);
              } else if (document.msExitFullscreen) { /* IE11 */
                document.msExitFullscreen();
                setIsFullscreen(false);
              }
            }
          };

          const handleFsError = (err) => {
            console.warn(`Fullscreen error: ${err.message}`);
            setToastMessage("Layar penuh tidak diizinkan di mode Preview ini.");
            setTimeout(() => setToastMessage(null), 4000);
          };

          useEffect(() => {
            const handleFullscreenChange = () => {
              const isFS = !!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement);
              setIsFullscreen(isFS);
            };
            document.addEventListener('fullscreenchange', handleFullscreenChange);
            document.addEventListener('webkitfullscreenchange', handleFullscreenChange);
            document.addEventListener('msfullscreenchange', handleFullscreenChange);
            return () => {
              document.removeEventListener('fullscreenchange', handleFullscreenChange);
              document.removeEventListener('webkitfullscreenchange', handleFullscreenChange);
              document.removeEventListener('msfullscreenchange', handleFullscreenChange);
            };
          }, []);

          const startGame = (category) => {
            setSelectedCategory(category);
            const questions = questionBank[category];
            const shuffledA = [...questions].sort(() => 0.5 - Math.random());
            const shuffledB = [...questions].sort(() => 0.5 - Math.random());
            setDeckA(shuffledA);
            setDeckB(shuffledB);
            setIndexA(0);
            setIndexB(0);
            setRopePosition(50);
            setFeedbackA(null);
            setFeedbackB(null);
            setFreezeA(false);
            setFreezeB(false);
            setGameState('playing');
          };

          const handleAnswer = (player, selectedOption) => {
            if (gameState !== 'playing') return;
            
            if (player === 'A') {
              if (freezeA) return;
              const currentQ = deckA[indexA];
              if (selectedOption === currentQ.correct) {
                setFeedbackA('correct');
                setRopePosition(prev => {
                    const next = prev - PULL_POWER;
                    checkWin(next);
                    return next;
                });
                setTimeout(() => {
                    setFeedbackA(null);
                    setIndexA(prev => (prev + 1) % deckA.length);
                }, 300);
              } else {
                setFeedbackA('wrong');
                setFreezeA(true);
                setTimeout(() => { setFeedbackA(null); setFreezeA(false); }, 1000);
              }
            }

            if (player === 'B') {
              if (freezeB) return;
              const currentQ = deckB[indexB];
              if (selectedOption === currentQ.correct) {
                setFeedbackB('correct');
                setRopePosition(prev => {
                    const next = prev + PULL_POWER;
                    checkWin(next);
                    return next;
                });
                setTimeout(() => {
                    setFeedbackB(null);
                    setIndexB(prev => (prev + 1) % deckB.length);
                }, 300);
              } else {
                setFeedbackB('wrong');
                setFreezeB(true);
                setTimeout(() => { setFeedbackB(null); setFreezeB(false); }, 1000);
              }
            }
          };

          const checkWin = (pos) => {
            if (pos <= WIN_LIMIT_A) setGameState('wonA');
            else if (pos >= WIN_LIMIT_B) setGameState('wonB');
          };

          // Logic apakah UI Game ditampilkan
          const showGameUI = ['menu', 'playing', 'wonA', 'wonB'].includes(gameState);

          return (
            <div className="h-screen w-full bg-sky-100 flex flex-col overflow-hidden relative font-sans touch-none select-none">
              
              {toastMessage && (
                <div className="absolute top-16 right-2 z-[60] animate-bounce">
                    <div className="bg-red-500 text-white px-4 py-2 rounded-lg shadow-lg flex items-center gap-2 text-xs font-bold">
                        <AlertCircle size={16} />
                        {toastMessage}
                    </div>
                </div>
              )}

              <div className="absolute top-2 right-2 z-50">
                  <button 
                      onClick={toggleFullscreen}
                      className="bg-white/80 p-2 rounded-full shadow hover:bg-white text-sky-700 transition-all"
                      title={isFullscreen ? "Exit Fullscreen" : "Enter Fullscreen"}
                  >
                      {isFullscreen ? <Minimize size={20} /> : <Maximize size={20} />}
                  </button>
              </div>

              {/* --- SPLASH SCREEN (INTRO) --- */}
              {gameState === 'splash' && (
                  <div className="fixed inset-0 z-[100] bg-white flex flex-col items-center justify-center p-6 text-center">
                      <div className="animate-zoom-in">
                          <h2 className="text-xl md:text-3xl text-gray-500 font-bold mb-4 tracking-widest uppercase">Created by</h2>
                          <h1 className="text-2xl md:text-5xl text-sky-600 font-black mb-2 leading-tight whitespace-nowrap">Ilining Uswatuun Khasanah</h1>
                          <div className="w-32 h-2 bg-yellow-400 my-6 rounded-full mx-auto"></div>
                          <p className="text-lg md:text-2xl text-gray-600 font-bold">Duta Teknologi Jawa Tengah 2024</p>
                      </div>
                  </div>
              )}

              {/* --- TITLE SCREEN (JUDUL GAME) --- */}
              {gameState === 'title' && (
                  <div className="absolute inset-0 z-[90] flex flex-col items-center justify-end pb-24 p-4 overflow-hidden bg-sky-100 animate-fade-in">
                      {/* Background Image Layer */}
                      <div className="absolute inset-0 z-0">
                          <img 
                              src="https://i.imgur.com/JeJbnl9.png" 
                              alt="Background" 
                              className="w-full h-full object-cover"
                          />
                      </div>

                      {/* Content - Button Only (Clean) */}
                      <div className="relative z-10 w-full max-w-md text-center flex flex-col items-center">
                          <button 
                              onClick={() => setGameState('menu')}
                              className="w-full max-w-xs bg-green-500 hover:bg-green-600 text-white font-black text-3xl py-4 rounded-full shadow-[0_6px_0_rgb(21,128,61)] active:shadow-none active:translate-y-2 transition-all flex items-center justify-center gap-3 border-4 border-white ring-4 ring-green-200/50"
                          >
                              <Play size={32} fill="currentColor" /> MASUK
                          </button>
                      </div>
                  </div>
              )}

              {/* --- GAME UI WRAPPER (Hanya tampil saat tidak splash/title) --- */}
              {showGameUI && (
                <>
                  {/* --- BAGIAN ATAS: SOAL --- */}
                  <div className="h-[15%] flex w-full p-1 gap-1 z-20">
                    <div className={`flex-1 rounded-lg border-2 border-green-500 bg-white flex flex-col items-center justify-center p-1 shadow-lg transition-colors ${freezeA ? 'bg-gray-200' : ''}`}>
                       {gameState === 'playing' && deckA.length > 0 ? (
                         <>
                           <span className="text-green-600 font-black text-[10px] uppercase leading-none mb-0.5">TIM A</span>
                           <h2 className="text-green-900 font-bold text-sm md:text-lg text-center leading-tight line-clamp-2">{deckA[indexA].question}</h2>
                           {freezeA && <span className="text-red-500 font-bold text-[10px] animate-pulse">SALAH!</span>}
                         </>
                       ) : <div className="text-gray-300 font-bold text-xl">A</div>}
                    </div>

                    <div className="flex flex-col justify-center items-center px-1 min-w-[50px]">
                        <span className="text-xl font-black text-sky-900 italic">VS</span>
                        {gameState === 'playing' && (
                            <button onClick={() => setGameState('menu')} className="mt-1 p-1 bg-gray-200 rounded-full hover:bg-gray-300">
                                <Home size={14} className="text-gray-600" />
                            </button>
                        )}
                    </div>

                    <div className={`flex-1 rounded-lg border-2 border-red-500 bg-white flex flex-col items-center justify-center p-1 shadow-lg transition-colors ${freezeB ? 'bg-gray-200' : ''}`}>
                       {gameState === 'playing' && deckB.length > 0 ? (
                         <>
                           <span className="text-red-600 font-black text-[10px] uppercase leading-none mb-0.5">TIM B</span>
                           <h2 className="text-red-900 font-bold text-sm md:text-lg text-center leading-tight line-clamp-2">{deckB[indexB].question}</h2>
                           {freezeB && <span className="text-red-500 font-bold text-[10px] animate-pulse">SALAH!</span>}
                         </>
                       ) : <div className="text-gray-300 font-bold text-xl">B</div>}
                    </div>
                  </div>

                  {/* --- BAGIAN TENGAH: ARENA VISUAL --- */}
                  <div className="h-[60%] relative w-full overflow-hidden border-y-2 border-white/50">
                    <img 
                        src="https://i.imgur.com/hu8aBFB.png" 
                        alt="Arena Background" 
                        className="absolute inset-0 w-full h-full object-cover z-0"
                    />
                    
                    {/* Markers (above bg) */}
                    <div className="absolute top-0 left-[15%] h-full border-l-2 border-dashed border-white/50 opacity-70 flex items-start pl-1 pt-2 z-0"><span className="text-[10px] font-bold text-white shadow-black drop-shadow-md">WIN A</span></div>
                    <div className="absolute top-0 right-[15%] h-full border-r-2 border-dashed border-white/50 opacity-70 flex items-start justify-end pr-1 pt-2 z-0"><span className="text-[10px] font-bold text-white shadow-black drop-shadow-md">WIN B</span></div>

                    <div 
                        className="absolute top-0 left-0 w-full h-full transition-transform duration-300 ease-out z-10"
                        style={{ transform: `translateX(${(ropePosition - 50) * 0.4}%)` }}
                    >
                        <div className="w-full h-full relative flex items-center justify-center">
                            <div className="absolute w-[120%] h-3 bg-amber-800 rounded top-[65%] shadow-md"></div>
                            <div className="absolute w-6 h-6 bg-yellow-400 rounded-full border-2 border-white top-[65%] left-1/2 transform -translate-x-1/2 -translate-y-1/2 z-10 shadow-sm"></div>
                            
                            <div className="absolute left-[20%] top-[45%] z-10">
                               <DinoLeft isPulling={feedbackA === 'correct'} />
                               {feedbackA === 'correct' && <div className="absolute -top-5 left-0 font-bold text-green-600 animate-bounce text-xs">TARIK!</div>}
                            </div>

                            <div className="absolute right-[20%] top-[45%] z-10">
                               <DinoRight isPulling={feedbackB === 'correct'} />
                               {feedbackB === 'correct' && <div className="absolute -top-5 right-0 font-bold text-red-600 animate-bounce text-xs">TARIK!</div>}
                            </div>
                        </div>
                    </div>
                  </div>

                  {/* --- BAGIAN BAWAH: TOMBOL JAWAB --- */}
                  <div className="h-[25%] w-full flex bg-gray-50 pb-safe">
                    <div className={`flex-1 p-1 border-r border-gray-300 transition-colors ${freezeA ? 'bg-gray-200' : 'bg-green-50'}`}>
                        {gameState === 'playing' && (
                            <div className="grid grid-cols-2 gap-1 h-full">
                                {deckA[indexA]?.options.map((opt, i) => (
                                    <button
                                        key={i}
                                        onPointerDown={(e) => { e.preventDefault(); handleAnswer('A', opt); }}
                                        disabled={freezeA}
                                        className="bg-white border-b-2 border-green-300 rounded-lg text-green-800 font-bold text-xs md:text-base shadow active:border-b-0 active:translate-y-0.5 touch-manipulation flex items-center justify-center hover:bg-green-100 leading-none px-1"
                                    >
                                        {opt}
                                    </button>
                                ))}
                            </div>
                        )}
                    </div>

                    <div className={`flex-1 p-1 border-l border-gray-300 transition-colors ${freezeB ? 'bg-gray-200' : 'bg-red-50'}`}>
                         {gameState === 'playing' && (
                            <div className="grid grid-cols-2 gap-1 h-full">
                                {deckB[indexB]?.options.map((opt, i) => (
                                    <button
                                        key={i}
                                        onPointerDown={(e) => { e.preventDefault(); handleAnswer('B', opt); }}
                                        disabled={freezeB}
                                        className="bg-white border-b-2 border-red-300 rounded-lg text-red-800 font-bold text-xs md:text-base shadow active:border-b-0 active:translate-y-0.5 touch-manipulation flex items-center justify-center hover:bg-red-100 leading-none px-1"
                                    >
                                        {opt}
                                    </button>
                                ))}
                            </div>
                        )}
                    </div>
                  </div>
                </>
              )}

              {/* --- MENU & WIN OVERLAYS --- */}
              {(gameState === 'menu' || gameState.startsWith('won')) && (
                  <div className="absolute inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
                      <div className="bg-white rounded-2xl p-4 w-full max-w-2xl h-auto max-h-[90vh] flex flex-col text-center shadow-2xl border-4 border-sky-500 animate-slide-up">
                          
                          {gameState === 'menu' ? (
                              <>
                                <div className="flex items-center justify-center gap-2 mb-2">
                                    <Trophy size={32} className="text-yellow-500" />
                                    <h1 className="text-2xl font-black text-slate-800">DINO ENGLISH</h1>
                                </div>
                                <p className="text-slate-500 mb-4 text-xs font-bold">PILIH TOPIK UNTUK MULAI BERMAIN:</p>
                                
                                <div className="grid grid-cols-2 md:grid-cols-3 gap-2 overflow-y-auto pr-1 flex-1 min-h-0">
                                    {Object.keys(questionBank).map((cat, idx) => (
                                        <button 
                                            key={idx}
                                            onClick={() => startGame(cat)}
                                            className="bg-blue-50 border-b-4 border-blue-200 text-blue-800 py-3 rounded-xl font-bold text-sm shadow active:border-b-0 active:translate-y-1 hover:bg-blue-100 transition-all flex flex-col items-center justify-center gap-1"
                                        >
                                            <span>{cat}</span>
                                        </button>
                                    ))}
                                </div>
                              </>
                          ) : (
                              <>
                                <h1 className={`text-3xl font-black mb-2 ${gameState === 'wonA' ? 'text-green-600' : 'text-red-600'}`}>
                                    {gameState === 'wonA' ? 'TIM A MENANG!' : 'TIM B MENANG!'}
                                </h1>
                                <div className="flex justify-center my-4">
                                    <img 
                                        src={gameState === 'wonA' ? "https://i.imgur.com/wNVwFKJ.png" : "https://i.imgur.com/UilWyZd.png"} 
                                        className="w-24 h-24 object-contain animate-bounce"
                                        alt="Winner"
                                    />
                                </div>
                                <div className="flex gap-2 mt-auto">
                                    <button onClick={() => startGame(selectedCategory)} className="flex-1 py-3 rounded-xl bg-gray-800 text-white font-bold shadow-lg active:scale-95 flex justify-center items-center gap-2 text-sm">
                                       <RotateCcw size={16} /> MAIN LAGI
                                    </button>
                                    <button onClick={() => setGameState('menu')} className="flex-1 py-3 rounded-xl bg-sky-500 text-white font-bold shadow-lg active:scale-95 flex justify-center items-center gap-2 text-sm">
                                       <Grid size={16} /> MENU
                                    </button>
                                </div>
                              </>
                          )}
                      </div>
                  </div>
              )}

            </div>
          );
        }

        // --- RENDER ---
        ReactDOM.createRoot(document.getElementById('root')).render(<DinoTugOfWar />);
    </script>
</body>
</html>
